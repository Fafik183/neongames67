<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEON RHYTHM</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040b;
    font-family:Arial,sans-serif;
    color:white;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            #101c35 0%,
            #080d1b 45%,
            #02040a 100%
        );
}

/* =========================
   TŁO
========================= */

#background{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.glow{
    position:absolute;
    left:50%;
    top:45%;

    width:70vmax;
    height:70vmax;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,220,255,.08),
            transparent 65%
        );

    filter:blur(20px);
}

.grid{
    position:absolute;
    left:-50%;
    bottom:-55%;

    width:200%;
    height:110%;

    transform:
        perspective(500px)
        rotateX(63deg);

    background-image:
        linear-gradient(
            rgba(70,180,210,.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(70,180,210,.045) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    animation:gridMove .7s linear infinite;

    mask-image:
        linear-gradient(
            to top,
            black,
            transparent 80%
        );
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }

    to{
        background-position:0 70px;
    }
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    z-index:100;

    top:0;
    left:0;
    right:0;

    height:85px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:12px 25px;

    background:
        linear-gradient(
            rgba(0,0,8,.72),
            transparent
        );
}

.stat{
    min-width:90px;
    text-align:center;
}

.label{
    color:#69758c;
    font-size:8px;
    letter-spacing:3px;
}

.number{
    margin-top:5px;

    color:#58dff0;

    font-size:22px;
    font-weight:bold;

    text-shadow:
        0 0 10px rgba(40,210,240,.6);
}

#starsCount{
    color:#e8ca4a;
}

/* =========================
   MUZYKA
========================= */

#musicButton{
    position:absolute;

    top:95px;
    right:20px;

    z-index:250;

    width:45px;
    height:45px;

    border-radius:50%;

    border:1px solid #55d8eb;

    background:
        rgba(0,5,20,.8);

    color:white;

    font-size:18px;

    cursor:pointer;
}

/* =========================
   PIOSENKI
========================= */

#songSelect{
    position:absolute;
    inset:0;

    z-index:300;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(
            circle at center,
            rgba(15,25,70,.55),
            rgba(0,0,5,.95)
        );
}

#songSelect h1{
    color:#65dff0;

    font-size:
        clamp(45px,10vw,90px);

    letter-spacing:7px;

    text-shadow:
        0 0 15px rgba(0,220,255,.7),
        0 0 40px rgba(0,120,255,.4);
}

#songSelect p{
    margin-top:18px;

    color:#69758c;

    font-size:10px;

    letter-spacing:3px;
}

.songs{
    display:flex;
    flex-direction:column;

    gap:12px;

    width:min(90%,420px);

    margin-top:35px;
}

.song{
    padding:18px 25px;

    border:1px solid #4fd4e8;

    border-radius:9px;

    background:
        rgba(0,200,230,.05);

    color:#62dff0;

    cursor:pointer;

    text-align:left;

    transition:.2s;
}

.song:hover{
    background:
        rgba(0,220,240,.14);

    box-shadow:
        0 0 18px
        rgba(0,220,240,.25);

    transform:translateY(-2px);
}

.song strong{
    display:block;

    font-size:16px;

    letter-spacing:2px;
}

.song span{
    display:block;

    margin-top:6px;

    color:#69758c;

    font-size:9px;

    letter-spacing:2px;
}

/* =========================
   TOR
========================= */

#track{
    position:absolute;

    z-index:20;

    left:50%;

    top:85px;
    bottom:0;

    width:min(92vw,620px);

    transform:translateX(-50%);

    display:flex;
}

.lane{
    position:relative;

    flex:1;

    height:100%;

    border-left:
        1px solid
        rgba(80,210,235,.13);
}

.lane:last-child{
    border-right:
        1px solid
        rgba(80,210,235,.13);
}

/* =========================
   DOLNE KLAWISZE
========================= */

.key{
    position:absolute;

    z-index:50;

    bottom:18px;

    width:calc(25% - 10px);
    height:65px;

    border-radius:12px;

    border:1px solid #4fd4e8;

    background:
        linear-gradient(
            rgba(0,30,50,.9),
            rgba(0,10,25,.95)
        );

    box-shadow:
        inset 0 0 15px rgba(0,220,255,.03);

    transition:
        transform .06s,
        background .06s,
        box-shadow .06s;
}

.key.active{
    background:
        rgba(0,220,255,.2);

    box-shadow:
        0 0 25px rgba(0,220,255,.7),
        inset 0 0 20px rgba(0,220,255,.2);

    transform:
        scale(.96);
}

#key0{
    left:0;
}

#key1{
    left:25%;
}

#key2{
    left:50%;
}

#key3{
    left:75%;
}

/*
   WAŻNE:
   Dolne klawisze NIE mają znaków.
*/

/* =========================
   SPADAJĄCE KLOCKI
========================= */

.note{
    position:absolute;

    z-index:40;

    width:calc(25% - 10px);
    height:55px;

    border-radius:10px;

    border:1px solid #65e8f5;

    background:
        linear-gradient(
            135deg,
            #39d9ed,
            #1479d0
        );

    box-shadow:
        0 0 12px rgba(0,220,255,.7),
        0 0 25px rgba(0,120,255,.35);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:27px;
    font-weight:bold;

    text-shadow:
        0 0 8px #fff;

    pointer-events:none;
}

/* =========================
   TRAFIENIE
========================= */

.hitEffect{
    position:absolute;

    z-index:80;

    width:65px;
    height:65px;

    border-radius:50%;

    border:3px solid #65f7ff;

    pointer-events:none;

    box-shadow:
        0 0 15px #00ffff,
        0 0 35px #008cff;

    animation:
        hit .35s ease-out forwards;
}

@keyframes hit{
    from{
        transform:scale(.3);
        opacity:1;
    }

    to{
        transform:scale(1.8);
        opacity:0;
    }
}

.spark{
    position:absolute;

    z-index:90;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #00ffff;

    pointer-events:none;

    animation:
        spark .45s ease-out forwards;
}

@keyframes spark{
    to{
        transform:
            translate(
                var(--x),
                var(--y)
            );

        opacity:0;
    }
}

/* =========================
   COMBO
========================= */

#combo{
    position:absolute;

    z-index:120;

    left:50%;
    top:105px;

    transform:translateX(-50%);

    color:#fff;

    font-size:24px;
    font-weight:bold;

    letter-spacing:3px;

    text-shadow:
        0 0 12px #00eaff;

    opacity:0;

    transition:.15s;
}

#combo.show{
    opacity:1;
}

/* =========================
   LEVEL UP
========================= */

#levelUp{
    position:absolute;

    z-index:200;

    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        rgba(0,5,18,.72);

    pointer-events:none;
}

#levelUp h2{
    color:#65eaf5;

    font-size:
        clamp(45px,10vw,90px);

    letter-spacing:7px;

    text-shadow:
        0 0 20px #00eaff,
        0 0 50px #007cff;
}

#levelUp p{
    margin-top:15px;

    color:#e8ca4a;

    font-size:18px;

    letter-spacing:4px;
}

/* =========================
   KONIEC PIOSENKI
========================= */

#finished{
    position:absolute;
    inset:0;

    z-index:250;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    text-align:center;

    background:
        rgba(2,3,13,.94);
}

#finished h2{
    color:#65eaf5;

    font-size:
        clamp(40px,9vw,80px);

    letter-spacing:6px;

    text-shadow:
        0 0 20px #00eaff;
}

#finished p{
    margin-top:15px;

    color:#69758c;

    letter-spacing:3px;
}

#finished .earned{
    margin-top:20px;

    color:#e8ca4a;

    font-size:28px;
    font-weight:bold;
}

.action{
    margin-top:30px;

    padding:14px 38px;

    border:1px solid #4fd4e8;
    border-radius:8px;

    background:
        rgba(0,200,230,.06);

    color:#62dff0;

    font-weight:bold;

    letter-spacing:3px;

    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #hud{
        padding:8px;
    }

    .stat{
        min-width:60px;
    }

    .label{
        font-size:6px;
        letter-spacing:1px;
    }

    .number{
        font-size:17px;
    }

    #track{
        width:96vw;
    }

    .key{
        bottom:12px;
        height:60px;
    }

    .note{
        height:50px;
        font-size:23px;
    }

    #musicButton{
        top:90px;
        right:10px;
    }
}
</style>

</head>

<!-- =========================
     AUDIO
========================= -->

<audio
 id="music"
 preload="auto"> </audio>

<script>

/* =====================================================
   ELEMENTY
===================================================== */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");

const songSelect =
    document.getElementById("songSelect");

const finished =
    document.getElementById("finished");

const levelUp =
    document.getElementById("levelUp");

const comboElement =
    document.getElementById("combo");

const comboNumber =
    document.getElementById("comboNumber");

const levelElement =
    document.getElementById("level");

const starsElement =
    document.getElementById("starsCount");

const songFinishedName =
    document.getElementById("songFinishedName");

const againButton =
    document.getElementById("againButton");

const menuButton =
    document.getElementById("menuButton");


/* =====================================================
   USTAWIENIA
===================================================== */

const songs = {

    free:{
        name:"FREE FROM DESIRE",
        file:"music2.mp3"
    },

    astronomia:{
        name:"ASTRONOMIA",
        file:"music1.mp3"
    }

};


/*
   Cztery strzałki.

   0 = lewo
   1 = dół
   2 = góra
   3 = prawo
*/

const arrows = [
    "←",
    "↓",
    "↑",
    "→"
];


/* =====================================================
   ZMIENNE
===================================================== */

let currentSong = null;

let playing = false;

let level = 1;

let combo = 0;

let stars = Number(
    localStorage.getItem(
        "neonRhythmStars"
    )
) || 0;


/*
   Na początku pierwsze 15 sekund
   jest wolniejsze.
*/

const START_SLOW_TIME = 15;


/*
   Bazowa prędkość.

   Po ukończeniu każdej całej piosenki
   zwiększamy poziom.
*/

const BASE_SPEED = 300;


/*
   Im wyższy level,
   tym szybsze spadanie.
*/

const LEVEL_SPEED = 65;


/*
   Okno trafienia.
*/

const HIT_WINDOW = 75;


/*
   Aktywne nuty.
*/

let notes = [];


/*
   RAF.
*/

let animationFrame = null;


/*
   Czas.
*/

let lastTime = 0;


/*
   Licznik generowania nut.
*/

let noteTimer = 0;


/*
   Aktualny indeks nut.
*/

let beatIndex = 0;


/*
   Czy muzyka została zakończona.
*/

let songFinished = false;


/* =====================================================
   GWIAZDKI
===================================================== */

starsElement.textContent =
    stars;


/* =====================================================
   WYBÓR PIOSENKI
===================================================== */

document
    .querySelectorAll(".song")
    .forEach(song => {

        song.addEventListener(
            "click",
            () => {

                const id =
                    song.dataset.song;

                startSong(id);

            }
        );

    });


/* =====================================================
   START PIOSENKI
===================================================== */

function startSong(id){

    const data =
        songs[id];

    if(!data){
        return;
    }


    currentSong =
        id;


    playing = true;

    songFinished = false;

    levelUp.style.display =
        "none";

    finished.style.display =
        "none";

    songSelect.style.display =
        "none";


    /*
       Każde rozpoczęcie piosenki
       zaczyna aktualny poziom.
    */

    combo = 0;

    comboNumber.textContent =
        "0";

    comboElement.textContent =
        "COMBO x0";


    clearNotes();


    /*
       Ustawienie audio.

       Free From Desire = music2.mp3
       Astronomia = music1.mp3
    */

    music.src =
        data.file;

    music.currentTime = 0;

    music.playbackRate = 1;


    /*
       Piosenka zaczyna się wolniej.
    */

    levelElement.textContent =
        level;


    music.volume = .35;


    music.play()
        .then(() => {

            musicButton.textContent =
                "🔊";

        })
        .catch(() => {

            musicButton.textContent =
                "🔇";

        });


    lastTime =
        performance.now();


    noteTimer = 0;

    beatIndex = 0;


    cancelAnimationFrame(
        animationFrame
    );


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(time){

    if(!playing){
        return;
    }


    let delta =
        (time-lastTime)/1000;


    if(delta > .05){
        delta = .05;
    }


    lastTime =
        time;


    update(delta);


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================================
   UPDATE
===================================================== */

function update(delta){

    /*
       Po 15 sekundach
       tempo staje się normalne.

       Po ukończeniu całej piosenki
       level zwiększa prędkość.
    */

    const elapsed =
        music.currentTime;


    let speed;


    if(elapsed < START_SLOW_TIME){

        /*
           Pierwsze 15 sekund:
           łagodny start.
        */

        speed =
            BASE_SPEED * .62 +
            level * 15;

    }else{

        speed =
            BASE_SPEED +
            (level-1) *
            LEVEL_SPEED;

    }


    /*
       Nuty są generowane
       w rytmie czasowym.
    */

    noteTimer += delta;


    /*
       Częstotliwość nut.

       Początek wolniejszy,
       później szybszy.
    */

    let interval;

    if(elapsed < START_SLOW_TIME){

        interval = .55;

    }else{

        interval =
            Math.max(
                .27,
                .43 -
                (level-1)*.025
            );

    }


    if(noteTimer >= interval){

        createNote();

        noteTimer = 0;

    }


    /*
       Ruch nut.
    */

    for(
        let i=notes.length-1;
        i>=0;
        i--
    ){

        const note =
            notes[i];


        note.y +=
            speed * delta;


        note.element.style.top =
            note.y + "px";


        /*
           Jeśli nuta przejdzie
           za klawiszami,
           usuwamy ją.

           Nie zabiera życia,
           bo nie ma życia.
        */

        window.innerHeight + 80

    }


    /*
       Jeżeli audio faktycznie
       zakończyło całą piosenkę.
    */

    if(
        music.ended &&
        !songFinished
    ){

        finishSong();

    }

}


/* =====================================================
   TWORZENIE NUTY
===================================================== */

function createNote(){

    const lane =
        Math.floor(
            Math.random()*4
        );


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "note";


    element.textContent =
        arrows[lane];


    /*
       Każda nuta jest dokładnie
       nad swoim dolnym klawiszem.
    */

    element.style.left =
        `calc(
            ${lane*25}% + 5px
        )`;


    /*
       Zaczynamy nad ekranem.
    */

    const startY =
        -70;


    element.style.top =
        startY + "px";


    document
        .getElementById("track")
        .appendChild(element);


    notes.push({

        element:element,

        lane:lane,

        y:startY

    });


    beatIndex++;

}


/* =====================================================
   KLAWISZE
===================================================== */

const keyElements = [

    document.getElementById("key0"),
    document.getElementById("key1"),
    document.getElementById("key2"),
    document.getElementById("key3")

];


/*
   Strzałki klawiatury.
*/

const keyMap = {

    ArrowLeft:0,

    ArrowDown:1,

    ArrowUp:2,

    ArrowRight:3

};


/* =====================================================
   OBSŁUGA KLAWISZA
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(!playing){
            return;
        }


        const lane =
            keyMap[event.key];


        if(lane === undefined){
            return;
        }


        event.preventDefault();


        pressKey(lane);

    }
);


/* =====================================================
   TRAFIENIE
===================================================== */

function pressKey(lane){

    const key =
        keyElements[lane];


    /*
       Efekt naciśnięcia.
    */

    key.classList.add(
        "active"
    );


    setTimeout(() => {

        key.classList.remove(
            "active"
        );

    },70);


    /*
       Szukamy najbliższej nuty
       w odpowiednim torze.
    */

    let best = null;

    let bestDistance =
        Infinity;


    for(
        const note of notes
    ){

        if(
            note.lane !== lane
        ){
            continue;
        }


        const keyRect =
            key.getBoundingClientRect();


        const noteRect =
            note.element.getBoundingClientRect();


        /*
           Środek nuty.
        */

        const noteCenter =
            noteRect.top +
            noteRect.height/2;


        /*
           Środek klawisza.
        */

        const keyCenter =
            keyRect.top +
            keyRect.height/2;


        const distance =
            Math.abs(
                noteCenter-keyCenter
            );


        if(
            distance <
            bestDistance
        ){

            best =
                note;

            bestDistance =
                distance;

        }

    }


    /*
       Brak odpowiedniej nuty.
    */

    if(
        !best ||
        bestDistance >
        HIT_WINDOW
    ){

        return;

    }


    /*
       TRAFIENIE
    */

    hitNote(best);

}


/* =====================================================
   HIT NOTE
===================================================== */

function hitNote(note){

    const rect =
        note.element
            .getBoundingClientRect();


    /*
       Piękny efekt.
    */

    createHitEffect(
        rect.left +
        rect.width/2,

        rect.top +
        rect.height/2
    );


    /*
       Combo.
    */

    combo++;


    comboNumber.textContent =
        combo;


    comboElement.textContent =
        "COMBO x" + combo;


    comboElement.classList.add(
        "show"
    );


    clearTimeout(
        window.comboTimeout
    );


    window.comboTimeout =
        setTimeout(() => {

            comboElement.classList.remove(
                "show"
            );

        },600);


    /*
       Usuwamy nutę.
    */

    note.element.remove();


    const index =
        notes.indexOf(note);


    if(index !== -1){

        notes.splice(
            index,
            1
        );

    }

}


/* =====================================================
   EFEKT TRAFIENIA
===================================================== */

function createHitEffect(x,y){

    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "hitEffect";


    effect.style.left =
        (x-32) + "px";


    effect.style.top =
        (y-32) + "px";


    document
        .getElementById("game")
        .appendChild(effect);


    setTimeout(
        () => effect.remove(),
        400
    );


    /*
       Iskry.
    */

    for(let i=0;i<10;i++){

        const spark =
            document.createElement(
                "div"
            );


        spark.className =
            "spark";


        spark.style.left =
            x + "px";


        spark.style.top =
            y + "px";


        const angle =
            Math.random() *
            Math.PI * 2;


        const distance =
            25 +
            Math.random()*50;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document
            .getElementById("game")
            .appendChild(spark);


        setTimeout(
            () => spark.remove(),
            500
        );

    }

}


/* =====================================================
   KONIEC PIOSENKI
===================================================== */

function finishSong(){

    playing = false;

    songFinished = true;


    cancelAnimationFrame(
        animationFrame
    );


    clearNotes();


    music.pause();


    musicButton.textContent =
        "🔇";


    /*
       GWIAZDKA DOPIERO
       ZA UKOŃCZENIE CAŁEJ PIOSENKI.
    */

    stars++;

    localStorage.setItem(
        "neonRhythmStars",
        stars
    );


    starsElement.textContent =
        stars;


    /*
       Level UP.
    */

    level++;


    levelElement.textContent =
        level;


    songFinishedName.textContent =
        songs[currentSong].name;


    finished.style.display =
        "flex";


    /*
       Krótka animacja LEVEL UP
       przed ekranem końcowym.
    */

    levelUp.style.display =
        "flex";


    setTimeout(() => {

        levelUp.style.display =
            "none";

    },1800);

}


/* =====================================================
   USUWANIE NUT
===================================================== */

function clearNotes(){

    notes.forEach(
        note =>
            note.element.remove()
    );


    notes = [];

}


/* =====================================================
   JESZCZE RAZ
===================================================== */

againButton.addEventListener(
    "click",
    () => {

        startSong(
            currentSong
        );

    }
);


/* =====================================================
   MENU
===================================================== */

menuButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "index.html";

    }
);


/* =====================================================
   MUZYKA ON/OFF
===================================================== */

musicButton.addEventListener(
    "click",
    () => {

        if(music.paused){

            music.play()
                .then(() => {

                    musicButton.textContent =
                        "🔊";

                })
                .catch(() => {});

        }else{

            music.pause();

            musicButton.textContent =
                "🔇";

        }

    }
);


/* =====================================================
   KLIKANIE / DOTYK
===================================================== */

keyElements.forEach(
    (key,index) => {

        key.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                if(playing){

                    pressKey(index);

                }

            }
        );

    }
);


/* =====================================================
   POWRÓT PO UTRACIE FOCUSU
===================================================== */

window.addEventListener(
    "blur",
    () => {

        if(playing){

            /*
               Nie zatrzymujemy gry,
               ale nie generujemy żadnych
               przypadkowych wejść.
            */

        }

    }
);

</script>
