<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GRAVITY RUSH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05030d;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            #21164b 0%,
            #0d0921 45%,
            #03020a 100%
        );
}

/* =========================
   TŁO
========================= */

#stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 7px #9d7cff;
    animation:starMove linear infinite;
}

@keyframes starMove{
    from{
        transform:translateY(-30px);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

#sun{
    position:absolute;
    left:50%;
    top:50%;
    width:500px;
    height:500px;
    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,80,210,.14),
            transparent 65%
        );

    filter:blur(20px);
}

/* =========================
   ŚWIAT
========================= */

#world{
    position:absolute;
    inset:0;
}

#floor{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:28%;

    border-top:
        2px solid rgba(126,90,255,.5);

    background:
        linear-gradient(
            rgba(80,40,180,.1),
            rgba(10,5,30,.7)
        );

    box-shadow:
        0 -10px 40px
        rgba(100,50,255,.12);
}

#ceiling{
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:28%;

    border-bottom:
        2px solid rgba(126,90,255,.5);

    background:
        linear-gradient(
            rgba(80,40,180,.1),
            rgba(10,5,30,.7)
        );

    box-shadow:
        0 10px 40px
        rgba(100,50,255,.12);
}

/* linie świata */

.line{
    position:absolute;
    height:1px;
    background:rgba(150,110,255,.15);
    width:100%;
}

#floor .line:nth-child(1){top:35%}
#floor .line:nth-child(2){top:55%}
#floor .line:nth-child(3){top:75%}

#ceiling .line:nth-child(1){bottom:35%}
#ceiling .line:nth-child(2){bottom:55%}
#ceiling .line:nth-child(3){bottom:75%}

/* =========================
   GRACZ
========================= */

#player{
    position:absolute;
    z-index:50;

    left:130px;
    top:calc(72% - 54px);

    width:48px;
    height:48px;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #8ff7ff 25%,
            #6c4dff 70%,
            #271653
        );

    border:
        2px solid #bffcff;

    box-shadow:
        0 0 12px #58eaff,
        0 0 30px rgba(100,80,255,.7);

    transition:
        top .14s cubic-bezier(.2,.8,.3,1);

    transform:rotate(45deg);
}

#player::before{
    content:"";

    position:absolute;

    width:10px;
    height:10px;

    border-radius:50%;

    background:#fff;

    top:10px;
    left:10px;

    box-shadow:
        18px 18px 0 #fff,
        0 0 10px #fff,
        18px 18px 10px #fff;
}

#player::after{
    content:"";

    position:absolute;

    width:15px;
    height:15px;

    border-radius:50%;

    background:#00ffff;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:
        0 0 15px #00ffff;
}

/* =========================
   PRZESZKODY
========================= */

.obstacle{
    position:absolute;
    z-index:30;

    width:58px;
    height:58px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #ff315d,
            #8e153c
        );

    border:
        2px solid #ff7c9a;

    box-shadow:
        0 0 15px #ff315d,
        0 0 30px rgba(255,30,80,.45);

    transform:rotate(45deg);
}

.obstacle::before{
    content:"";

    position:absolute;

    inset:13px;

    border:
        2px solid rgba(255,255,255,.7);

    transform:rotate(45deg);
}

/* kolce */

.spike{
    position:absolute;
    z-index:31;

    width:0;
    height:0;

    border-left:30px solid transparent;
    border-right:30px solid transparent;

    filter:
        drop-shadow(
            0 0 10px #ff3860
        );
}

.spike.floor{
    border-bottom:58px solid #ff3860;
}

.spike.ceiling{
    border-top:58px solid #ff3860;
}

/* =========================
   KRYSZTAŁY
========================= */

.crystal{
    position:absolute;
    z-index:35;

    width:28px;
    height:40px;

    background:
        linear-gradient(
            135deg,
            #fff,
            #68f6ff 35%,
            #7861ff 70%,
            #28175f
        );

    clip-path:
        polygon(
            50% 0,
            100% 30%,
            78% 100%,
            50% 82%,
            22% 100%,
            0 30%
        );

    filter:
        drop-shadow(
            0 0 12px #61f6ff
        );

    animation:
        crystalFloat .55s
        ease-in-out infinite
        alternate;
}

@keyframes crystalFloat{
    from{
        transform:translateY(3px) rotate(0deg);
    }

    to{
        transform:translateY(-6px) rotate(8deg);
    }
}

/* =========================
   BONUS
========================= */

.power{
    position:absolute;
    z-index:36;

    width:38px;
    height:38px;

    border-radius:50%;

    border:
        2px solid #ffe55c;

    background:
        radial-gradient(
            circle,
            #fff,
            #ffe34e 30%,
            #ff7b00 75%,
            transparent 76%
        );

    box-shadow:
        0 0 15px #ffd900,
        0 0 35px rgba(255,130,0,.5);

    animation:
        powerPulse .45s
        infinite alternate;
}

@keyframes powerPulse{
    from{
        transform:scale(.85);
    }

    to{
        transform:scale(1.15);
    }
}

/* =========================
   HUD
========================= */

#hud{
    position:absolute;
    z-index:100;

    top:0;
    left:0;
    right:0;

    height:85px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 25px;

    background:
        linear-gradient(
            rgba(3,2,12,.8),
            transparent
        );
}

.box{
    text-align:center;
}

.label{
    color:#776d99;
    font-size:9px;
    letter-spacing:3px;
}

.value{
    margin-top:5px;
    color:#77eaff;
    font-size:23px;
    font-weight:bold;
    text-shadow:0 0 12px #54eaff;
}

#best{
    color:#ffd84f;
}

/* =========================
   LEVEL
========================= */

#levelText{
    position:absolute;
    z-index:120;

    left:50%;
    top:48%;

    transform:translate(-50%,-50%);

    color:#fff;

    font-size:
        clamp(45px,10vw,100px);

    font-weight:900;

    letter-spacing:8px;

    text-shadow:
        0 0 15px #8d62ff,
        0 0 40px #ff43c8;

    opacity:0;

    pointer-events:none;
}

#levelText.show{
    animation:
        levelAnim 1.5s ease forwards;
}

@keyframes levelAnim{
    0%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    30%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1.1);
    }

    70%{
        opacity:1;
        transform:
            translate(-50%,-50%)
            scale(1;
        );
    }

    100%{
        opacity:0;
        transform:
            translate(-50%,-50%)
            scale(1.3);
    }
}

/* =========================
   START
========================= */

#start{
    position:absolute;
    z-index:300;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        radial-gradient(
            circle,
            rgba(42,25,90,.45),
            rgba(3,2,10,.96)
        );
}

#start h1{
    font-size:
        clamp(55px,13vw,130px);

    line-height:.8;

    color:#77ecff;

    letter-spacing:8px;

    text-shadow:
        0 0 15px #58eaff,
        0 0 40px #7550ff;
}

#start h1 span{
    display:block;
    color:#ff55cb;

    text-shadow:
        0 0 15px #ff55cb;
}

#start p{
    margin-top:30px;

    color:#81779f;

    font-size:11px;

    letter-spacing:3px;
}

#startButton,
#restartButton{
    margin-top:35px;

    padding:16px 55px;

    color:#77ecff;

    border:
        1px solid #62eaff;

    background:
        rgba(60,200,255,.06);

    border-radius:8px;

    font-weight:bold;

    letter-spacing:4px;

    cursor:pointer;
}

#startButton:hover,
#restartButton:hover{
    background:
        rgba(60,200,255,.18);

    box-shadow:
        0 0 25px
        rgba(70,220,255,.4);
}

/* =========================
   GAME OVER
========================= */

#gameOver{
    position:absolute;
    z-index:300;
    inset:0;

    display:none;

    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    background:
        rgba(3,2,10,.96);
}

#gameOver h2{
    color:#ff4775;

    font-size:
        clamp(45px,10vw,90px);

    text-shadow:
        0 0 20px #ff315d;
}

.finalLabel{
    margin-top:20px;

    color:#77708f;

    letter-spacing:4px;
}

#finalScore{
    margin-top:8px;

    color:#74eaff;

    font-size:70px;

    font-weight:bold;
}

#record{
    display:none;

    margin-top:10px;

    color:#ffe052;

    font-weight:bold;

    letter-spacing:3px;
}

/* =========================
   INFO
========================= */

#hint{
    position:absolute;
    z-index:80;

    bottom:18px;
    left:50%;

    transform:translateX(-50%);

    color:#645c7d;

    font-size:9px;

    letter-spacing:3px;

    white-space:nowrap;
}

/* =========================
   FLASH
========================= */

#flash{
    position:absolute;
    z-index:200;

    inset:0;

    background:#fff;

    opacity:0;

    pointer-events:none;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #hint{
        font-size:8px;
    }

    #player{
        left:80px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="stars"></div>
    <div id="sun"></div>

    <div id="world">

        <div id="ceiling">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

        <div id="floor">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>

    </div>

    <div id="hud">

        <div class="box">
            <div class="label">WYNIK</div>
            <div id="score" class="value">0</div>
        </div>

        <div class="box">
            <div class="label">BEST</div>
            <div id="best" class="value">0</div>
        </div>

        <div class="box">
            <div class="label">LEVEL</div>
            <div id="level" class="value">1</div>
        </div>

    </div>

    <div id="levelText">
        LEVEL 1
    </div>

    <div id="player"></div>

    <div id="hint">
        SPACJA / ↑ / KLIKNIJ — ZMIANA GRAWITACJI
    </div>

    <div id="flash"></div>

    <!-- START -->

    <div id="start">

        <h1>
            GRAVITY
            <span>RUSH</span>
        </h1>

        <p>
            ZMIENIAJ GRAWITACJĘ • UNIKAJ • ZBIERAJ
        </p>

        <button id="startButton">
            START
        </button>

        <p>
            SPACJA / ↑ / KLIKNIĘCIE
        </p>

    </div>

    <!-- GAME OVER -->

    <div id="gameOver">

        <h2>
            KONIEC
        </h2>

        <div class="finalLabel">
            WYNIK
        </div>

        <div id="finalScore">
            0
        </div>

        <div id="record">
            🏆 NOWY REKORD!
        </div>

        <button id="restartButton">
            JESZCZE RAZ
        </button>

    </div>

</div>

<script>

/* ==========================================
   GWIAZDY
========================================== */

const stars =
document.getElementById("stars");

for(let i=0;i<100;i++){

    const s =
    document.createElement("div");

    s.className="star";

    s.style.left =
    Math.random()*100+"%";

    s.style.top =
    Math.random()*100+"%";

    s.style.animationDuration =
    (2+Math.random()*5)+"s";

    s.style.animationDelay =
    (-Math.random()*6)+"s";

    stars.appendChild(s);
}


/* ==========================================
   ELEMENTY
========================================== */

const game =
document.getElementById("game");

const player =
document.getElementById("player");

const scoreEl =
document.getElementById("score");

const bestEl =
document.getElementById("best");

const levelEl =
document.getElementById("level");

const start =
document.getElementById("start");

const startButton =
document.getElementById("startButton");

const gameOver =
document.getElementById("gameOver");

const restartButton =
document.getElementById("restartButton");

const finalScore =
document.getElementById("finalScore");

const record =
document.getElementById("record");

const levelText =
document.getElementById("levelText");

const flash =
document.getElementById("flash");


/* ==========================================
   HIGH SCORE
========================================== */

let best =
Number(
localStorage.getItem(
"gravityRushBest"
)
) || 0;

bestEl.textContent=best;


/* ==========================================
   ZMIENNE
========================================== */

let running=false;

let gravity=1;

let playerY=0;

let velocity=0;

let score=0;

let level=1;

let time=0;

let lastTime=0;

let spawnTimer=0;

let crystalTimer=0;

let powerTimer=0;

let obstacles=[];

let crystals=[];

let powers=[];


/*
   Początkowa prędkość.
*/

let speed=430;


/* ==========================================
   START
========================================== */

function startGame(){

    running=true;

    gravity=1;

    playerY=
    window.innerHeight*0.72-54;

    velocity=0;

    score=0;

    level=1;

    time=0;

    spawnTimer=0;

    crystalTimer=0;

    powerTimer=0;

    speed=430;


    obstacles.forEach(
        x=>x.el.remove()
    );

    crystals.forEach(
        x=>x.el.remove()
    );

    powers.forEach(
        x=>x.el.remove()
    );


    obstacles=[];

    crystals=[];

    powers=[];


    player.style.top=
    playerY+"px";


    start.style.display="none";

    gameOver.style.display="none";

    record.style.display="none";


    updateHUD();


    lastTime=
    performance.now();


    requestAnimationFrame(loop);
}


/* ==========================================
   PĘTLA
========================================== */

function loop(now){

    if(!running)
        return;


    let dt=
    (now-lastTime)/1000;


    if(dt>.04)
        dt=.04;


    lastTime=now;


    update(dt);


    requestAnimationFrame(loop);
}


/* ==========================================
   UPDATE
========================================== */

function update(dt){

    time+=dt;


    /* LEVEL */

    const newLevel=
    Math.floor(time/15)+1;


    if(newLevel>level){

        level=newLevel;

        speed=
        430+
        (level-1)*70;

        showLevel();
    }


    /* GRAWITACJA */

    velocity +=
    gravity*
    1850*
    dt;


    playerY +=
    velocity*
    dt;


    /* granice */

    const floorY=
    window.innerHeight*0.72-54;

    const ceilingY=
    window.innerHeight*0.28;


    if(playerY>floorY){

        playerY=floorY;

        velocity=0;
    }


    if(playerY<ceilingY){

        playerY=ceilingY;

        velocity=0;
    }


    player.style.top=
    playerY+"px";


    /* ODBIJANIE GRAWITACJI
       pozycja wizualna
    */

    if(gravity===1){

        player.style.transform=
        "rotate(45deg)";
    }else{

        player.style.transform=
        "rotate(225deg)";
    }


    /* PRZESZKODY */

    spawnTimer+=dt;


    const spawnDelay=
    Math.max(
        .42,
        .95-
        (level-1)*.045
    );


    if(spawnTimer>=spawnDelay){

        spawnObstacle();

        spawnTimer=0;


        if(
            level>=4 &&
            Math.random()<.22
        ){

            setTimeout(
            ()=>{

                if(running)
                    spawnObstacle();

            },
            150
            );
        }
    }


    /* KRYSZTAŁY */

    crystalTimer+=dt;


    if(crystalTimer>=1.1){

        spawnCrystal();

        crystalTimer=0;
    }


    /* POWER */

    powerTimer+=dt;


    if(
        powerTimer>=7
    ){

        spawnPower();

        powerTimer=0;
    }


    moveObjects(dt);


    score +=
    dt*
    (10+level*2);


    updateHUD();
}


/* ==========================================
   PRZESZKODA
========================================== */

function spawnObstacle(){

    const el=
    document.createElement("div");


    const fromCeiling=
    Math.random()<.5;


    if(fromCeiling){

        el.className=
        "spike ceiling";

        el.style.top=
        "calc(28% - 3px)";

    }else{

        el.className=
        "spike floor";

        el.style.top=
        "calc(72% - 55px)";
    }


    el.style.left=
    window.innerWidth+"px";


    game.appendChild(el);


    obstacles.push({

        el:el,

        x:window.innerWidth,

        side:
        fromCeiling
        ? "ceiling"
        : "floor",

        width:60,

        height:58

    });
}


/* ==========================================
   KRYSZTAŁ
========================================== */

function spawnCrystal(){

    const el=
    document.createElement("div");


    el.className="crystal";


    const fromTop=
    Math.random()<.5;


    const floorY=
    window.innerHeight*.72;

    const ceilingY=
    window.innerHeight*.28;


    let y;


    if(fromTop){

        y=
        ceilingY+
        20+
        Math.random()*80;

    }else{

        y=
        floorY-
        60-
        Math.random()*80;
    }


    el.style.left=
    window.innerWidth+"px";


    el.style.top=
    y+"px";


    game.appendChild(el);


    crystals.push({

        el:el,

        x:window.innerWidth,

        y:y

    });
}


/* ==========================================
   POWER
========================================== */

function spawnPower(){

    const el=
    document.createElement("div");


    el.className="power";


    const floorY=
    window.innerHeight*.72;


    const ceilingY=
    window.innerHeight*.28;


    const y=
    Math.random()<.5
    ? ceilingY+35
    : floorY-75;


    el.style.left=
    window.innerWidth+"px";


    el.style.top=
    y+"px";


    game.appendChild(el);


    powers.push({

        el:el,

        x:window.innerWidth,

        y:y

    });
}


/* ==========================================
   RUCH OBIEKTÓW
========================================== */

function moveObjects(dt){

    /* przeszkody */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const o=
        obstacles[i];


        o.x-=
        speed*dt;


        o.el.style.left=
        o.x+"px";


        if(
            collision(
                o.el
            )
        ){

            endGame();

            return;
        }


        if(
            o.x < -100
        ){

            o.el.remove();

            obstacles.splice(
                i,
                1
            );
        }
    }


    /* kryształy */

    for(
        let i=crystals.length-1;
        i>=0;
        i--
    ){

        const c=
        crystals[i];


        c.x-=
        speed*dt;


        c.el.style.left=
        c.x+"px";


        if(
            collision(
                c.el
            )
        ){

            score+=150;

            c.el.remove();

            crystals.splice(
                i,
                1
            );

            popup(
                "+150"
            );

            continue;
        }


        if(c.x<-70){

            c.el.remove();

            crystals.splice(
                i,
                1
            );
        }
    }


    /* power */

    for(
        let i=powers.length-1;
        i>=0;
        i--
    ){

        const p=
        powers[i];


        p.x-=
        speed*dt;


        p.el.style.left=
        p.x+"px";


        if(
            collision(
                p.el
            )
        ){

            score+=300;

            p.el.remove();

            powers.splice(
                i,
                1
            );

            /*
               chwilowe spowolnienie
            */

            speed*=.55;


            setTimeout(
            ()=>{

                if(running){

                    speed=
                    430+
                    (level-1)*70;
                }

            },
            3500
            );


            popup("SLOW MOTION");

            continue;
        }


        if(p.x<-80){

            p.el.remove();

            powers.splice(
                i,
                1
            );
        }
    }
}


/* ==========================================
   KOLIZJA
========================================== */

function collision(el){

    const a=
    el.getBoundingClientRect();

    const b=
    player.getBoundingClientRect();


    const pad=8;


    return !(
        a.right <
        b.left+pad ||

        a.left >
        b.right-pad ||

        a.bottom <
        b.top+pad ||

        a.top >
        b.bottom-pad
    );
}


/* ==========================================
   GRAWITACJA
========================================== */

function flipGravity(){

    if(!running)
        return;


    gravity*=-1;


    /*
       mocne natychmiastowe
       wybicie w drugą stronę
    */

    velocity=
    gravity*
    -620;


    /*
       efekt
    */

    flash.style.opacity=.12;


    setTimeout(
    ()=>{
        flash.style.opacity=0;
    },
    80
    );
}


/* ==========================================
   POPUP
========================================== */

function popup(text){

    const p=
    document.createElement("div");


    p.textContent=text;


    p.style.position="fixed";

    p.style.zIndex=500;

    p.style.left=
    player.getBoundingClientRect().left+"px";

    p.style.top=
    player.getBoundingClientRect().top+"px";

    p.style.color="#7df7ff";

    p.style.fontSize="20px";

    p.style.fontWeight="bold";

    p.style.textShadow=
    "0 0 15px #42eaff";

    p.style.pointerEvents="none";


    document.body.appendChild(p);


    p.animate(

        [
            {
                transform:"translateY(0)",
                opacity:1
            },
            {
                transform:"translateY(-70px)",
                opacity:0
            }
        ],

        {
            duration:800,
            easing:"ease-out"
        }
    );


    setTimeout(
        ()=>p.remove(),
        800
    );
}


/* ==========================================
   LEVEL
========================================== */

function showLevel(){

    levelText.textContent=
    "LEVEL "+level;


    levelText.classList.remove(
        "show"
    );


    void levelText.offsetWidth;


    levelText.classList.add(
        "show"
    );
}


/* ==========================================
   HUD
========================================== */

function updateHUD(){

    scoreEl.textContent=
    Math.floor(score);


    bestEl.textContent=
    best;


    levelEl.textContent=
    level;
}


/* ==========================================
   GAME OVER
========================================== */

function endGame(){

    if(!running)
        return;


    running=false;


    const final=
    Math.floor(score);


    finalScore.textContent=
    final;


    if(final>best){

        best=final;

        localStorage.setItem(
            "gravityRushBest",
            best
        );


        record.style.display=
        "block";
    }


    bestEl.textContent=
    best;


    gameOver.style.display=
    "flex";
}


/* ==========================================
   STEROWANIE
========================================== */

document.addEventListener(
"keydown",
e=>{

    if(
        e.code==="Space" ||
        e.code==="ArrowUp"
    ){

        e.preventDefault();

        flipGravity();
    }

});


document.addEventListener(
"pointerdown",
e=>{

    if(
        e.target===startButton ||
        e.target===restartButton
    )
        return;


    if(running)
        flipGravity();

});


/* ==========================================
   PRZYCISKI
========================================== */

startButton.onclick=
startGame;

restartButton.onclick=
startGame;


/* ==========================================
   STARTOWY HUD
========================================== */

updateHUD();

</script>

</body>
</html>
